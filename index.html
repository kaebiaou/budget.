<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget Perso</title>
<meta name="theme-color" content="#1f5f8b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --ink:#18212b; --muted:#5f6b78; --line:#dde3ea;
  --brand:#1f5f8b; --brand-ink:#ffffff; --ok:#1d7a46; --warn:#b26b00; --bad:#b3261e;
  --alloc:#1f5f8b; --spent:#e07b39; --rev:#6a8f3a; --soft:#e8eef5;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12161b; --card:#1b2129; --ink:#e7ecf1; --muted:#9aa6b3; --line:#2c3540;
    --brand:#4f9bd1; --brand-ink:#0d1216; --ok:#4cc27e; --warn:#e0a53a; --bad:#ef6b62;
    --alloc:#4f9bd1; --spent:#f0925a; --rev:#9cc260; --soft:#232c37; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:10px 16px calc(10px);padding-top:calc(10px + env(safe-area-inset-top))}
header .row{display:flex;gap:8px;align-items:center}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header select{font-size:15px;padding:6px 8px;border-radius:8px;border:0;background:rgba(255,255,255,.92);color:#18212b;max-width:55vw}
#syncdot{width:10px;height:10px;border-radius:50%;background:#999;flex:none}
#syncdot.ok{background:#4cc27e}#syncdot.busy{background:#e0a53a}#syncdot.err{background:#ef6b62}
header .period{font-size:12px;opacity:.9;margin-top:2px}
main{padding:12px 16px 96px;max-width:900px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--muted);padding:8px 2px 10px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--brand);font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi{background:var(--soft);border-radius:10px;padding:8px 10px}
.kpi .l{font-size:12px;color:var(--muted)}.kpi .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.pos{color:var(--ok)}.neg{color:var(--bad)}.wrn{color:var(--warn)}
.muted{color:var(--muted)}.small{font-size:12px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:14px;cursor:pointer}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:600}
.btn.bad{color:var(--bad)}
.btn:disabled{opacity:.5}
.btns{display:flex;flex-wrap:wrap;gap:8px}
label.f{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
input.amt{text-align:right;font-variant-numeric:tabular-nums}
.rub{display:grid;grid-template-columns:44px 1fr 120px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rub:first-child{border-top:0}
.rub .code{font-size:12px;font-weight:700;color:var(--brand)}
.rub .lib{font-size:14px;cursor:pointer;word-break:break-word}
.rub .prev{font-size:11.5px;color:var(--muted)}
.grp{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 2px}
.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.w{background:var(--warn)}.bar i.b{background:var(--bad)}
.sold{padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.sold:first-child{border-top:0}
.sold .t{display:flex;justify-content:space-between;gap:8px}
.sold .t b{font-variant-numeric:tabular-nums;white-space:nowrap}
.dep{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--line);align-items:center}
.dep:first-child{border-top:0}
.dep>div:first-child{min-width:0;flex:1;word-break:break-word}
.dep .x{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer;padding:0 4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
svg text{fill:var(--muted);font-size:11px}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#18212b;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
dialog{border:0;border-radius:14px;padding:16px;max-width:460px;width:calc(100vw - 32px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.sticky-tot{position:sticky;bottom:64px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.sticky-tot .t{display:flex;justify-content:space-between}
.hidden{display:none!important}
.empty{text-align:center;padding:24px 8px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--soft);color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="row">
    <span id="syncdot" title="Synchronisation"></span>
    <h1>Budget Perso</h1>
    <select id="moisSel" aria-label="Mois"></select>
  </div>
  <div class="period" id="periodTxt"></div>
</header>
<main id="main"></main>
<nav id="nav">
  <button data-v="budget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 13h3M8 16h6"/></svg>Budget</button>
  <button data-v="depense"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Dépense</button>
  <button data-v="soldes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Soldes</button>
  <button data-v="rapports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 20V10M12 20V4M18 20v-7"/></svg>Rapports</button>
  <button data-v="reglages"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Réglages</button>
</nav>
<div class="toast" id="toast"></div>
<dialog id="dlg"></dialog>

<script>
"use strict";
/* ==================== Constantes ==================== */
const LS_KEY = "budgetperso.data.v1";
const LS_CFG = "budgetperso.cfg.v1";
const MOIS_FR = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
const MOIS_ABR = {JAN:1,JANV:1,JANVIER:1,FEV:2,FEVR:2,FEVRIER:2,MAR:3,MARS:3,AVR:4,AVRIL:4,MAI:5,JUIN:6,JUIL:7,JUILLET:7,AOU:8,AOUT:8,SEP:9,SEPT:9,SEPTEMBRE:9,OCT:10,OCTOBRE:10,NOV:11,NOVEMBRE:11,DEC:12,DECEMBRE:12};
const GROUPES = ["Banque & crédit","Dons & église","Enfants","Épargne","Personnel","Communication","Véhicule","Maison","Alimentation","Famille & soutien","Santé","Divers"];
const GROUP_COLORS = ["#1f5f8b","#7b4fa0","#d0558c","#1d7a46","#e07b39","#3a9bb5","#8a6d3b","#5a7d2a","#c99a1e","#b3261e","#2f8f83","#7a8794"];

/* ==================== Utilitaires ==================== */
const $ = s => document.querySelector(s);
const now = () => Date.now();
const uid = () => now().toString(36) + Math.random().toString(36).slice(2, 8);
const fmtN = n => new Intl.NumberFormat("fr-FR", {maximumFractionDigits: 0}).format(Math.round(n || 0));
const fmt = n => fmtN(n) + " F";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const parseAmt = s => { const v = Number(String(s ?? "").replace(/[\s  F]/g, "").replace(",", ".")); return isFinite(v) ? Math.round(v) : 0; };
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase();
const pad = n => String(n).padStart(2, "0");
const isoDate = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => isoDate(new Date());
const fmtDate = s => { if (!s) return ""; const [y, m, d] = s.split("-"); return d + "/" + m + "/" + y; };
const moisTitre = k => { const [y, m] = k.split("-").map(Number); return MOIS_FR[m - 1] + " " + y; };
const moisShort = k => { const [y, m] = k.split("-").map(Number); return MOIS_FR[m - 1].slice(0, 3) + ". " + String(y).slice(2); };
const nextKey = k => { let [y, m] = k.split("-").map(Number); m++; if (m > 12) { m = 1; y++; } return y + "-" + pad(m); };
const prevKeyOf = k => { let [y, m] = k.split("-").map(Number); m--; if (m < 1) { m = 12; y--; } return y + "-" + pad(m); };
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return isoDate(d); };
const addMonths = (s, n) => { const d = new Date(s + "T12:00:00"); d.setMonth(d.getMonth() + n); return isoDate(d); };
function toast(msg, ms = 2200) { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), ms); }

/* ==================== Données ==================== */
// Chaque entité porte u (horodatage de modification) pour fusionner entre appareils.
function emptyData() { return { v: 1, rubriques: {}, mois: {}, depenses: {} }; }
let D = emptyData();
let CFG = { clientId: "", vue: "budget", mois: "" };
try { D = Object.assign(emptyData(), JSON.parse(localStorage.getItem(LS_KEY) || "null") || {}); } catch (e) {}
try { CFG = Object.assign(CFG, JSON.parse(localStorage.getItem(LS_CFG) || "null") || {}); } catch (e) {}
const saveCfg = () => { try { localStorage.setItem(LS_CFG, JSON.stringify(CFG)); } catch (e) {} };
function save(sync = true) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(D)); } catch (e) { toast("Stockage local indisponible"); }
  if (sync) Sync.schedule();
}

const rubs = () => Object.values(D.rubriques).sort((a, b) => a.ordre - b.ordre || a.code.localeCompare(b.code));
const moisKeys = () => Object.keys(D.mois).filter(k => !D.mois[k].del).sort();
const M = () => D.mois[CFG.mois];
function moisRubs(k) {
  const m = D.mois[k]; if (!m) return [];
  return rubs().filter(r => m.alloc[r.id] && !m.alloc[r.id].del);
}
const alloue = (k, rid) => { const a = D.mois[k]?.alloc[rid]; return a && !a.del ? (a.m || 0) : 0; };
const depsMois = k => Object.values(D.depenses).filter(d => !d.del && d.mois === k);
function depenseParRub(k) { const o = {}; for (const d of depsMois(k)) o[d.rub] = (o[d.rub] || 0) + d.montant; return o; }
const revenus = k => { const m = D.mois[k]; if (!m) return 0; return (m.revenus || []).filter(r => !r.del).reduce((s, r) => s + (r.m || 0), 0); };
function totaux(k) {
  const rs = moisRubs(k), dp = depenseParRub(k);
  let A = 0, S = 0; for (const r of rs) { A += alloue(k, r.id); } for (const v of Object.values(dp)) S += v;
  const R = revenus(k);
  return { revenus: R, alloue: A, depense: S, reste: A - S, nonAlloue: R - A, soldeReel: R - S };
}
function devinerGroupe(lib) {
  const s = norm(lib);
  const T = [
    [/MAMAN|ROSELYNE|IMPREVU|SOUTIEN/, "Famille & soutien"],
    [/PRET|FRAIS DE TENUE|INTERET|OVP|CREDIT BANC/, "Banque & crédit"],
    [/DIME|OFFRANDE|\bDON\b/, "Dons & église"],
    [/ABIGA|FIDELIA|CANTINE|ENFANT|ECOLE|SCOLAR/, "Enfants"],
    [/EPARGNE|DEPOT/, "Épargne"],
    [/CARBURANT|VOITURE|JUKE|VIDANGE|ESSENCE/, "Véhicule"],
    [/CREDIT MTN|MOOV|INTERNET|EN LIGNE|TELEPHON/, "Communication"],
    [/MARCHE|RAVITAIL|CUISINE|CUSINE|NOURRIT/, "Alimentation"],
    [/ELECTRICITE|GAZ|ENTRETIEN|TRAVAUX|ORDURES|CANAL|LOYER|EAU\b|MAISON/, "Maison"],
    [/SOIN|MEDIC|SANTE|PHARMA/, "Santé"],
    [/POCHE|HABILLEMENT|PRESSING|TONDEUSE|COUTURE/, "Personnel"],
  ];
  for (const [re, g] of T) if (re.test(s)) return g;
  return "Divers";
}
function prochainCode() {
  let max = 0; for (const r of Object.values(D.rubriques)) { const n = parseInt(String(r.code).replace(/\D/g, ""), 10); if (n > max) max = n; }
  return "P" + pad(max + 1);
}
function moisCourantParDefaut() {
  const t = today(), ks = moisKeys();
  for (const k of ks) { const m = D.mois[k]; if (m.debut && m.fin && m.debut <= t && t <= m.fin) return k; }
  return ks[ks.length - 1] || "";
}

/* ==================== Fusion (synchronisation) ==================== */
function mergeData(a, b) {
  const out = emptyData();
  const pick = (x, y) => (!x ? y : !y ? x : ((y.u || 0) > (x.u || 0) ? y : x));
  for (const coll of ["rubriques", "depenses"]) {
    const ids = new Set([...Object.keys(a[coll] || {}), ...Object.keys(b[coll] || {})]);
    for (const id of ids) out[coll][id] = pick(a[coll]?.[id], b[coll]?.[id]);
  }
  const ks = new Set([...Object.keys(a.mois || {}), ...Object.keys(b.mois || {})]);
  for (const k of ks) {
    const x = a.mois?.[k], y = b.mois?.[k];
    if (!x || !y) { out.mois[k] = JSON.parse(JSON.stringify(x || y)); continue; }
    const base = JSON.parse(JSON.stringify(pick(x, y)));
    base.alloc = {};
    const rids = new Set([...Object.keys(x.alloc || {}), ...Object.keys(y.alloc || {})]);
    for (const r of rids) base.alloc[r] = pick(x.alloc?.[r], y.alloc?.[r]);
    out.mois[k] = base;
  }
  return out;
}

/* ==================== OneDrive (Microsoft Graph, OAuth PKCE) ==================== */
const AUTH = "https://login.microsoftonline.com/consumers/oauth2/v2.0";
const SCOPE = "Files.ReadWrite.AppFolder offline_access";
const FILE_URL = "https://graph.microsoft.com/v1.0/me/drive/special/approot:/budget.json:/content";
const redirectUri = () => location.origin + location.pathname;
const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const Tok = {
  get() { try { return JSON.parse(localStorage.getItem("budgetperso.tok") || "null"); } catch (e) { return null; } },
  set(t) { localStorage.setItem("budgetperso.tok", JSON.stringify(t)); },
  clear() { localStorage.removeItem("budgetperso.tok"); }
};
async function odLogin() {
  if (!CFG.clientId) { toast("Saisissez d'abord l'ID d'application (Réglages)"); return; }
  const verifier = b64url(crypto.getRandomValues(new Uint8Array(32)));
  const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
  const state = b64url(crypto.getRandomValues(new Uint8Array(12)));
  sessionStorage.setItem("pkce", JSON.stringify({ verifier, state }));
  const p = new URLSearchParams({ client_id: CFG.clientId, response_type: "code", redirect_uri: redirectUri(), scope: SCOPE,
    code_challenge: challenge, code_challenge_method: "S256", state, response_mode: "query", prompt: "select_account" });
  location.href = AUTH + "/authorize?" + p;
}
async function odHandleRedirect() {
  const q = new URLSearchParams(location.search);
  if (!q.get("code") && !q.get("error")) return;
  history.replaceState(null, "", redirectUri());
  if (q.get("error")) { toast("Connexion refusée : " + (q.get("error_description") || q.get("error")), 5000); return; }
  const saved = JSON.parse(sessionStorage.getItem("pkce") || "null");
  if (!saved || saved.state !== q.get("state")) { toast("Connexion OneDrive : état invalide"); return; }
  const r = await fetch(AUTH + "/token", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ client_id: CFG.clientId, grant_type: "authorization_code", code: q.get("code"), redirect_uri: redirectUri(), code_verifier: saved.verifier, scope: SCOPE }) });
  const j = await r.json();
  if (!r.ok) { toast("Erreur jeton : " + (j.error_description || j.error), 6000); return; }
  Tok.set({ at: j.access_token, rt: j.refresh_token, exp: now() + (j.expires_in - 120) * 1000 });
  toast("OneDrive connecté");
}
async function odToken() {
  const t = Tok.get(); if (!t) return null;
  if (t.exp > now()) return t.at;
  if (!t.rt) return null;
  const r = await fetch(AUTH + "/token", { method: "POST", headers: { "Content-Type": "application/x-www-form-urlencoded" },
    body: new URLSearchParams({ client_id: CFG.clientId, grant_type: "refresh_token", refresh_token: t.rt, scope: SCOPE }) });
  const j = await r.json();
  if (!r.ok) { Tok.clear(); throw new Error("Session OneDrive expirée : reconnectez-vous (Réglages)"); }
  Tok.set({ at: j.access_token, rt: j.refresh_token || t.rt, exp: now() + (j.expires_in - 120) * 1000 });
  return j.access_token;
}
/* Fichier local (Windows : fichier dans le dossier OneDrive synchronisé) */
const FH = {
  handle: null,
  async db() { return new Promise((res, rej) => { const o = indexedDB.open("budgetperso", 1); o.onupgradeneeded = () => o.result.createObjectStore("kv"); o.onsuccess = () => res(o.result); o.onerror = () => rej(o.error); }); },
  async load() { try { const db = await this.db(); return await new Promise(r => { const g = db.transaction("kv").objectStore("kv").get("fh"); g.onsuccess = () => r(g.result || null); g.onerror = () => r(null); }); } catch (e) { return null; } },
  async store(h) { try { const db = await this.db(); db.transaction("kv", "readwrite").objectStore("kv").put(h, "fh"); } catch (e) {} },
  async forget() { this.handle = null; try { const db = await this.db(); db.transaction("kv", "readwrite").objectStore("kv").delete("fh"); } catch (e) {} },
  async perm(ask) { if (!this.handle) return false; const o = { mode: "readwrite" }; if (await this.handle.queryPermission(o) === "granted") return true; return ask ? (await this.handle.requestPermission(o)) === "granted" : false; }
};
const Sync = {
  state: "off", msg: "", timer: null, running: false,
  set(s, m) { this.state = s; this.msg = m || ""; const d = $("#syncdot"); d.className = s === "ok" ? "ok" : s === "busy" ? "busy" : s === "err" ? "err" : ""; d.title = m || s; if (CFG.vue === "reglages") renderReglages(); },
  schedule() { clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), 2500); },
  async run(ask = false) {
    if (this.running) { this.schedule(); return; }
    const hasOD = !!Tok.get(), hasFH = !!FH.handle;
    if (!hasOD && !hasFH) { this.set("off", "Aucune synchronisation configurée"); return; }
    this.running = true; this.set("busy", "Synchronisation…");
    try {
      let merged = D;
      if (hasOD) {
        const at = await odToken(); if (!at) throw new Error("Non connecté à OneDrive");
        let r = await fetch(FILE_URL, { headers: { Authorization: "Bearer " + at } });
        if (r.ok) merged = mergeData(merged, await r.json());
        else if (r.status !== 404) throw new Error("Lecture OneDrive : HTTP " + r.status);
        const w = await fetch(FILE_URL, { method: "PUT", headers: { Authorization: "Bearer " + at, "Content-Type": "application/json" }, body: JSON.stringify(merged) });
        if (!w.ok) throw new Error("Écriture OneDrive : HTTP " + w.status);
      }
      if (hasFH && await FH.perm(ask)) {
        const f = await FH.handle.getFile(); const txt = await f.text();
        if (txt.trim()) { try { merged = mergeData(merged, JSON.parse(txt)); } catch (e) {} }
        const ws = await FH.handle.createWritable(); await ws.write(JSON.stringify(merged, null, 1)); await ws.close();
      } else if (hasFH && !hasOD) { throw new Error("Autorisez l'accès au fichier (Réglages › Synchroniser)"); }
      const changed = JSON.stringify(merged) !== JSON.stringify(D);
      D = merged; save(false);
      CFG.lastSync = now(); saveCfg();
      this.set("ok", "Synchronisé à " + new Date().toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }));
      if (changed) render();
    } catch (e) { this.set("err", e.message || String(e)); }
    finally { this.running = false; }
  }
};

function renderDepense() {

/* ---------- Soldes ---------- */
function renderSoldes() {
  const main = $("#main"), k = CFG.mois;

  const t = totaux(k), dp = depenseParRub(k), rs = moisRubs(k);

  if (m.debut && m.fin) { const a = new Date(m.debut + "T00:00"), b = new Date(m.fin + "T23:59"), n = new Date(); const p = Math.min(1, Math.max(0, (n - a) / (b - a))); pct = Math.round(p * 100); }

  html += `<div class="card"><h2>Solde par rubrique</h2>`;

/* ---------- Rapports ---------- */
function svgBarsMois(rows) {
  // rows: [{k, revenus, alloue, depense}]
  const W = Math.max(320, rows.length * 70), H = 200, pl = 46, pb = 22, pt = 8;
  const max = Math.max(1, ...rows.flatMap(r => [r.revenus, r.alloue, r.depense]));
  const step = (W - pl - 6) / rows.length, bw = Math.min(16, step / 4);
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:${Math.min(W, 600)}px" role="img" aria-label="Revenus, alloué et dépensé par mois">`;
  for (let i = 0; i <= 4; i++) { const v = max * i / 4; s += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 4}" y="${y(v) + 4}" text-anchor="end">${v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : Math.round(v / 1e3) + "k"}</text>`; }
  rows.forEach((r, i) => {
    const x0 = pl + step * i + step / 2 - bw * 1.5 - 2;
    [["revenus", "var(--rev)"], ["alloue", "var(--alloc)"], ["depense", "var(--spent)"]].forEach(([f, c], j) => {
      s += `<rect x="${x0 + j * (bw + 2)}" y="${y(r[f])}" width="${bw}" height="${Math.max(0, H - pb - y(r[f]))}" fill="${c}" rx="2"><title>${moisTitre(r.k)} · ${f === "alloue" ? "alloué" : f === "depense" ? "dépensé" : "revenus"} : ${fmt(r[f])}</title></rect>`; });
    s += `<text x="${pl + step * i + step / 2}" y="${H - 6}" text-anchor="middle">${moisShort(r.k)}</text>`;
  });
  return s + `</svg>`;
}
function hbars(items, total, colorFn) {
  return items.map((it, i) => `<div style="margin:6px 0"><div class="t" style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><span>${esc(it.label)}</span><b style="white-space:nowrap">${fmt(it.v)}${total ? ` · ${Math.round(it.v / total * 100)} %` : ""}</b></div>
    <div class="bar" style="height:10px"><i style="width:${total ? Math.min(100, it.v / Math.max(...items.map(x => x.v), 1) * 100) : 0}%;background:${colorFn ? colorFn(it, i) : "var(--alloc)"}"></i></div></div>`).join("");
}
function svgRythme(k) {
  const m = D.mois[k]; if (!m?.debut || !m?.fin) return "";
  const a = new Date(m.debut + "T12:00"), b = new Date(m.fin + "T12:00"), days = Math.max(1, Math.round((b - a) / 864e5) + 1);
  const t = totaux(k); const cum = new Array(days).fill(0);
  for (const d of depsMois(k)) { const i = Math.round((new Date(d.date + "T12:00") - a) / 864e5); cum[Math.min(days - 1, Math.max(0, i))] += d.montant; }
  for (let i = 1; i < days; i++) cum[i] += cum[i - 1];
  const todayIdx = Math.min(days - 1, Math.round((new Date(today() + "T12:00") - a) / 864e5));
  const W = 600, H = 180, pl = 46, pb = 20, pt = 8, max = Math.max(1, t.alloue, cum[days - 1]);
  const x = i => pl + (W - pl - 6) * i / (days - 1 || 1), y = v => pt + (H - pt - pb) * (1 - v / max);
  const lim = Math.max(0, Math.min(days - 1, todayIdx));
  let pts = []; for (let i = 0; i <= lim; i++) pts.push(x(i) + "," + y(cum[i]));
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Rythme de dépense">`;
  for (let i = 0; i <= 4; i++) { const v = max * i / 4; s += `<line x1="${pl}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl - 4}" y="${y(v) + 4}" text-anchor="end">${v >= 1e6 ? (v / 1e6).toFixed(1) + "M" : Math.round(v / 1e3) + "k"}</text>`; }
  s += `<line x1="${x(0)}" y1="${y(0)}" x2="${x(days - 1)}" y2="${y(t.alloue)}" stroke="var(--alloc)" stroke-width="2" stroke-dasharray="5 4"/>`;
  if (todayIdx >= 0) s += `<polyline points="${pts.join(" ")}" fill="none" stroke="var(--spent)" stroke-width="2.5"/>`;
  s += `<text x="${x(0)}" y="${H - 4}">${fmtDate(m.debut).slice(0, 5)}</text><text x="${x(days - 1)}" y="${H - 4}" text-anchor="end">${fmtDate(m.fin).slice(0, 5)}</text>`;
  return s + `</svg><div class="legend"><span style="--c:var(--alloc)">Budget linéaire</span><span style="--c:var(--spent)">Dépensé cumulé</span></div>`;
}

  if (!r) return null;
  const m1 = MOIS_ABR[r[2]] || MOIS_ABR[r[2].slice(0, 4)] || MOIS_ABR[r[2].slice(0, 3)], m2 = MOIS_ABR[r[5]] || MOIS_ABR[r[5].slice(0, 4)] || MOIS_ABR[r[5].slice(0, 3)];
  if (!m1 || !m2) return null;
  const y2 = Number(r[6] || r[3] || key.slice(0, 4)), y1 = Number(r[3] || (m1 > m2 ? y2 - 1 : y2));
  return { debut: `${y1}-${pad(m1)}-${pad(r[1])}`, fin: `${y2}-${pad(m2)}-${pad(r[4])}` };
}
function cleSheet(name) {

}
async function importerExcel() {

    row++; X.utils.sheet_add_aoa(ws, [[null, null, "SOLDE RÉEL (revenus − dépensé)"]], { origin: "A" + row });
    ws["E" + row] = { t: "n", f: (revRows.length ? revRows.map(x => "D" + x).join("+") : "0") + `-E${totRow}` };
    ws["!ref"] = "A1:F" + row; ws["!cols"] = [{ wch: 2 }, { wch: 7 }, { wch: 60 }, { wch: 13 }, { wch: 13 }, { wch: 13 }];
    const [y, mm] = k.split("-"); X.utils.book_append_sheet(wb, ws, ["JANV","FEV","MARS","AVR","MAI","JUIN","JUIL","AOUT","SEPT","OCT","NOV","DEC"][mm - 1] + " " + y);
  }
  const deps = Object.values(D.depenses).filter(d => !d.del).sort((a, b) => (a.date || "").localeCompare(b.date || ""));
  const wsd = X.utils.aoa_to_sheet([["Date", "Mois", "Code", "Rubrique", "Montant", "Note"], ...deps.map(d => { const r = D.rubriques[d.rub] || {}; return [fmtDate(d.date), moisTitre(d.mois), r.code, r.libelle, d.montant, d.note || ""]; })]);
  wsd["!cols"] = [{ wch: 11 }, { wch: 15 }, { wch: 6 }, { wch: 50 }, { wch: 12 }, { wch: 30 }];
  X.utils.book_append_sheet(wb, wsd, "DEPENSES");
  X.writeFile(wb, `Budget-${today()}.xlsx`);
}

/* ---------- Boîte de dialogue ---------- */
function openDlg(html) { const d = $("#dlg"); d.innerHTML = html; if (!d.open) d.showModal(); }
function closeDlg() { $("#dlg").close(); }
$("#dlg").addEventListener("click", e => { if (e.target.id === "dlg") closeDlg(); });

/* ==================== Démarrage ==================== */
$("#nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setVue(b.dataset.v); });
$("#moisSel").addEventListener("change", e => { CFG.mois = e.target.value; saveCfg(); render(); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") Sync.run(); });
(async function init() {
  try { await odHandleRedirect(); } catch (e) { toast("Connexion OneDrive : " + e.message, 5000); }
  FH.handle = await FH.load();
  render();
  Sync.run();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
